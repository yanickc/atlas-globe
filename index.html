<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas — Featured Locations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e7e1d4;
      --muted: #9a9284;
      --faint: #6d675c;
      --gold: #e4c27a;
      --gold-dim: #b8944a;
      --line: rgba(231, 225, 212, 0.12);
      --panel: rgba(8, 10, 14, 0.72);
      --danger: #c45c4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      color: var(--ink);
      font-family: "Source Sans 3", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 70% 70% at 55% 50%, transparent 42%, rgba(5, 6, 10, 0.55) 100%),
        linear-gradient(90deg, rgba(5, 6, 10, 0.55) 0%, transparent 28%);
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .hud > * { pointer-events: auto; }

    .rail {
      position: absolute;
      top: 28px;
      left: 28px;
      bottom: 28px;
      width: min(320px, calc(100vw - 40px));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .mast {
      padding: 4px 2px 0;
    }

    .kicker {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .mast h1 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 500;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .mast p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      max-width: 28ch;
    }

    .list-wrap {
      flex: 1;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
    }

    .list-head span {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .locations {
      overflow-y: auto;
      flex: 1;
      padding: 6px 0;
    }

    .locations::-webkit-scrollbar { width: 6px; }
    .locations::-webkit-scrollbar-thumb { background: rgba(231, 225, 212, 0.16); }

    .loc {
      width: 100%;
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      border-left: 2px solid transparent;
    }

    .loc:hover { background: rgba(228, 194, 122, 0.06); }
    .loc:focus-visible { outline: 1px solid var(--gold); outline-offset: -1px; }

    .loc.is-active {
      background: rgba(228, 194, 122, 0.1);
      border-left-color: var(--gold);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(228, 194, 122, 0.8);
    }

    .loc:not(.is-active) .dot {
      background: #5c574c;
      box-shadow: none;
    }

    .loc-name {
      font-family: "Newsreader", Georgia, serif;
      font-size: 17px;
      font-weight: 500;
    }

    .loc-meta {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .loc-coord {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      color: var(--faint);
      white-space: nowrap;
    }

    .hint {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--faint);
      padding: 0 2px;
    }

    .status {
      position: absolute;
      right: 28px;
      bottom: 28px;
      max-width: min(360px, calc(100vw - 56px));
      padding: 18px 20px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .status .kicker { margin-bottom: 6px; }

    .status h2 {
      font-family: "Newsreader", Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .status .coord {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--gold-dim);
      margin: 6px 0 10px;
    }

    .status p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .float-label {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -120%);
      pointer-events: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(5, 6, 10, 0.9);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .float-label.is-on { opacity: 1; }

    .loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #05060a;
      z-index: 5;
      transition: opacity 0.6s ease;
    }

    .loader.is-gone {
      opacity: 0;
      pointer-events: none;
    }

    .loader-inner {
      text-align: center;
    }

    .loader-inner span {
      display: block;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .bar {
      width: 160px;
      height: 1px;
      background: rgba(231, 225, 212, 0.12);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 40%;
      background: var(--gold);
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(350%); }
    }

    @media (max-width: 720px) {
      .rail {
        top: 16px;
        left: 16px;
        right: 16px;
        bottom: auto;
        width: auto;
        max-height: 42vh;
      }
      .mast h1 { font-size: 26px; }
      .status {
        right: 16px;
        left: 16px;
        bottom: 16px;
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar i { animation: none; width: 100%; }
      .float-label { transition: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div class="vignette"></div>

  <div class="hud">
    <aside class="rail">
      <div class="mast">
        <div class="kicker">Observatory</div>
        <h1>Atlas</h1>
        <p>A quiet globe. Drag to spin. Click a marker — or a name — to travel there.</p>
      </div>
      <div class="list-wrap">
        <div class="list-head">
          <span>Featured</span>
          <span id="count">0</span>
        </div>
        <div class="locations" id="list" role="list"></div>
      </div>
      <div class="hint" id="hint">Drag to spin · idle resumes rotation</div>
    </aside>

    <article class="status" id="status" hidden>
      <div class="kicker" id="status-region"></div>
      <h2 id="status-name"></h2>
      <div class="coord" id="status-coord"></div>
      <p id="status-note"></p>
    </article>

    <div class="float-label" id="float-label"></div>
  </div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <span>Raising the globe</span>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const GLOBE_R = 1.6;
    const ATMOS_R = 1.675;
    const MARKER_R = GLOBE_R + 0.012;
    const CAM_IDLE = 4.15;
    const CAM_FOCUS = 3.05;
    const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const LOCATIONS = [
      { id: "reykjavik", name: "Reykjavík", region: "Iceland", lat: 64.1466, lng: -21.9426, note: "North Atlantic rift. Steam fields sit on the seam between two plates." },
      { id: "nyc", name: "New York", region: "United States", lat: 40.7128, lng: -74.006, note: "Mouth of the Hudson. A harbor city built on glacial till and schist." },
      { id: "london", name: "London", region: "United Kingdom", lat: 51.5074, lng: -0.1278, note: "Tidal Thames. The old meridian still runs through Greenwich." },
      { id: "cairo", name: "Cairo", region: "Egypt", lat: 30.0444, lng: 31.2357, note: "Nile floodplain. The city sits where the river fans toward the delta." },
      { id: "cape-town", name: "Cape Town", region: "South Africa", lat: -33.9249, lng: 18.4241, note: "Where the Atlantic turns. Table Mountain is a leftover of an ancient seabed." },
      { id: "sao-paulo", name: "São Paulo", region: "Brazil", lat: -23.5505, lng: -46.6333, note: "Brazilian Highlands. A plateau city above the Santos escarpment." },
      { id: "nairobi", name: "Nairobi", region: "Kenya", lat: -1.2921, lng: 36.8219, note: "East African Rift. Cool highlands on the equator, a mile above the sea." },
      { id: "mumbai", name: "Mumbai", region: "India", lat: 19.076, lng: 72.8777, note: "Arabian Sea. Seven islands stitched into one peninsula." },
      { id: "singapore", name: "Singapore", region: "Singapore", lat: 1.3521, lng: 103.8198, note: "Strait of Malacca. A pivot between the Indian and Pacific oceans." },
      { id: "tokyo", name: "Tokyo", region: "Japan", lat: 35.6762, lng: 139.6503, note: "Kantō plain. The bay opens east; Fuji sits west, when the air is clear." },
      { id: "sydney", name: "Sydney", region: "Australia", lat: -33.8688, lng: 151.2093, note: "Port Jackson. A drowned river valley with a sandstone rim." },
      { id: "vancouver", name: "Vancouver", region: "Canada", lat: 49.2827, lng: -123.1207, note: "Salish Sea. Mountains drop straight into a temperate rainforest coast." }
    ];

    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");
    const floatEl = document.getElementById("float-label");
    const loaderEl = document.getElementById("loader");

    countEl.textContent = String(LOCATIONS.length).padStart(2, "0");

    LOCATIONS.forEach((loc) => {
      const btn = document.createElement("button");
      btn.className = "loc";
      btn.type = "button";
      btn.dataset.id = loc.id;
      btn.setAttribute("role", "listitem");
      btn.innerHTML = `
        <span class="dot" aria-hidden="true"></span>
        <span>
          <span class="loc-name">${loc.name}</span>
          <span class="loc-meta">${loc.region}</span>
        </span>
        <span class="loc-coord">${fmtCoord(loc.lat, loc.lng)}</span>
      `;
      btn.addEventListener("click", () => focusLocation(loc, true));
      listEl.appendChild(btn);
    });

    function fmtCoord(lat, lng) {
      const ns = lat >= 0 ? "N" : "S";
      const ew = lng >= 0 ? "E" : "W";
      return `${Math.abs(lat).toFixed(1)}°${ns}  ${Math.abs(lng).toFixed(1)}°${ew}`;
    }

    function latLngToVec3(lat, lng, r) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lng + 180);
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function lerpAngle(a, b, t) {
      let d = b - a;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return a + d * t;
    }

    const wrap = document.getElementById("canvas-wrap");
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05060a, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0.8, 1.1, CAM_IDLE);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2.35;
    controls.maxDistance = 8;
    controls.rotateSpeed = 0.45;
    controls.autoRotate = !REDUCE;
    controls.autoRotateSpeed = 0.42;
    controls.target.set(0, 0, 0);

    const sunDir = new THREE.Vector3(0.55, 0.35, 1.0).normalize();

    scene.add(new THREE.AmbientLight(0x8a9bb0, 0.42));
    const hemi = new THREE.HemisphereLight(0xb7c8dc, 0x241c16, 0.55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff3e0, 1.15);
    sun.position.copy(sunDir).multiplyScalar(8);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x5a7a98, 0.32);
    fill.position.set(-3.2, -0.4, 1.4);
    scene.add(fill);

    const stars = buildStars(1800);
    scene.add(stars);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const markerGroup = new THREE.Group();
    globeGroup.add(markerGroup);

    const markerMeshes = [];
    const glowSprites = [];
    let activeId = null;
    let camAnim = null;
    let idleTimer = 0;
    let pointerDown = null;
    const clock = new THREE.Clock();

    const texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin("anonymous");

    const DAY_URL = "./earth-day.jpg";
    const NIGHT_URL = "./earth-night.jpg";
    const BUMP_URL = "./earth-bump.png";

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
      ]);
    }

    withTimeout(Promise.all([
      loadTex(DAY_URL, true),
      loadTex(NIGHT_URL, true),
      loadTex(BUMP_URL, false)
    ]), 12000).then(([day, night, bump]) => {
      buildEarth(day, night, bump);
      buildAtmosphere();
      buildClouds();
      buildMarkers();
      loaderEl.classList.add("is-gone");
    }).catch(() => {
      buildEarth(null, null, null);
      buildAtmosphere();
      buildMarkers();
      loaderEl.classList.add("is-gone");
    });

    function loadTex(url, srgb) {
      return new Promise((resolve, reject) => {
        texLoader.load(
          url,
          (t) => {
            if (srgb) t.colorSpace = THREE.SRGBColorSpace;
            t.anisotropy = 8;
            resolve(t);
          },
          undefined,
          reject
        );
      });
    }

    function buildEarth(day, night, bump) {
      const geo = new THREE.SphereGeometry(GLOBE_R, 96, 64);
      let mat;
      if (day && night) {
        mat = new THREE.ShaderMaterial({
          uniforms: {
            dayMap: { value: day },
            nightMap: { value: night },
            bumpMap: { value: bump },
            lightDirection: { value: sunDir.clone() }
          },
          vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormalW;
            void main() {
              vUv = uv;
              vNormalW = normalize(mat3(modelMatrix) * normal);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D dayMap;
            uniform sampler2D nightMap;
            uniform vec3 lightDirection;
            varying vec2 vUv;
            varying vec3 vNormalW;
            void main() {
              vec3 dayC = texture2D(dayMap, vUv).rgb;
              vec3 nightC = texture2D(nightMap, vUv).rgb;
              float ndl = dot(normalize(vNormalW), normalize(lightDirection));
              float dayness = smoothstep(-0.15, 0.38, ndl);
              vec3 nightLit = nightC * 1.55 + dayC * 0.22;
              vec3 color = mix(nightLit, dayC, dayness);
              float term = 1.0 - smoothstep(0.0, 0.45, abs(ndl));
              color += vec3(0.5, 0.28, 0.1) * term * 0.18;
              gl_FragColor = vec4(color, 1.0);
            }
          `
        });
      } else {
        mat = new THREE.MeshStandardMaterial({
          color: 0x1c3d5c,
          roughness: 0.86,
          metalness: 0.04,
          bumpMap: bump || null,
          bumpScale: 0.04
        });
      }
      const earth = new THREE.Mesh(geo, mat);
      earth.name = "earth";
      globeGroup.add(earth);

      if (bump && mat.isMeshStandardMaterial) earth.material.bumpMap = bump;
    }

    function buildAtmosphere() {
      const mat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          void main() {
            vec3 viewDir = normalize(cameraPosition - vWorldPos);
            float fresnel = pow(0.62 - dot(vNormal, viewDir), 2.4);
            fresnel = clamp(fresnel, 0.0, 1.0);
            vec3 col = mix(vec3(0.22, 0.42, 0.78), vec3(0.62, 0.82, 1.0), fresnel);
            gl_FragColor = vec4(col, fresnel * 0.55);
          }
        `
      });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(ATMOS_R, 64, 48), mat);
      globeGroup.add(mesh);
    }

    function buildClouds() {
      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(GLOBE_R + 0.018, 64, 48),
        new THREE.MeshPhongMaterial({
          color: 0xcfd8e6,
          transparent: true,
          opacity: 0.07,
          depthWrite: false
        })
      );
      clouds.name = "clouds";
      globeGroup.add(clouds);
    }

    function makeGlowTexture() {
      const c = document.createElement("canvas");
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, "rgba(255, 236, 180, 1)");
      g.addColorStop(0.18, "rgba(228, 194, 122, 0.85)");
      g.addColorStop(0.45, "rgba(228, 194, 122, 0.22)");
      g.addColorStop(1, "rgba(228, 194, 122, 0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function buildMarkers() {
      const glowTex = makeGlowTexture();
      const coreGeo = new THREE.SphereGeometry(0.018, 16, 12);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffe7a8 });
      const ringGeo = new THREE.RingGeometry(0.028, 0.036, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xe4c27a,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85,
        depthWrite: false
      });

      LOCATIONS.forEach((loc) => {
        const pos = latLngToVec3(loc.lat, loc.lng, MARKER_R);
        const g = new THREE.Group();
        g.position.copy(pos);
        g.lookAt(0, 0, 0);
        g.userData = { loc, kind: "marker" };

        const core = new THREE.Mesh(coreGeo, coreMat.clone());
        core.userData = { loc, kind: "hit" };
        g.add(core);

        const hit = new THREE.Mesh(
          new THREE.SphereGeometry(0.055, 12, 10),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hit.userData = { loc, kind: "hit" };
        g.add(hit);

        const ring = new THREE.Mesh(ringGeo, ringMat.clone());
        ring.rotation.x = Math.PI / 2;
        g.add(ring);

        const sprite = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: glowTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.9
          })
        );
        sprite.scale.set(0.22, 0.22, 1);
        g.add(sprite);

        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.003, 0.003, 0.08, 6),
          new THREE.MeshBasicMaterial({
            color: 0xe4c27a,
            transparent: true,
            opacity: 0.45
          })
        );
        stem.position.set(0, 0, -0.04);
        stem.rotation.x = Math.PI / 2;
        g.add(stem);

        markerGroup.add(g);
        markerMeshes.push(hit);
        glowSprites.push({ sprite, ring, core, loc });
      });
    }

    function buildStars(n) {
      const positions = new Float32Array(n * 3);
      const colors = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = 40 + Math.random() * 60;
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = Math.random() * Math.PI * 2;
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        const w = 0.72 + Math.random() * 0.28;
        const gold = Math.random() > 0.88;
        colors[i * 3] = gold ? 1 : w;
        colors[i * 3 + 1] = gold ? 0.9 : w;
        colors[i * 3 + 2] = gold ? 0.72 : w;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      return new THREE.Points(
        geo,
        new THREE.PointsMaterial({
          size: 0.08,
          vertexColors: true,
          transparent: true,
          opacity: 0.85,
          depthWrite: false
        })
      );
    }

    function setActive(loc) {
      activeId = loc ? loc.id : null;
      listEl.querySelectorAll(".loc").forEach((el) => {
        el.classList.toggle("is-active", el.dataset.id === activeId);
      });
      if (!loc) {
        statusEl.hidden = true;
        floatEl.classList.remove("is-on");
        return;
      }
      document.getElementById("status-region").textContent = loc.region;
      document.getElementById("status-name").textContent = loc.name;
      document.getElementById("status-coord").textContent = fmtCoord(loc.lat, loc.lng);
      document.getElementById("status-note").textContent = loc.note;
      statusEl.hidden = false;
      floatEl.textContent = loc.name;
      floatEl.classList.add("is-on");
      const btn = listEl.querySelector(`[data-id="${loc.id}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest", behavior: REDUCE ? "auto" : "smooth" });
    }

    function focusLocation(loc, fromUi) {
      setActive(loc);
      const dest = latLngToVec3(loc.lat, loc.lng, CAM_FOCUS);
      const start = camera.position.clone();
      const sSph = new THREE.Spherical().setFromVector3(start);
      const eSph = new THREE.Spherical().setFromVector3(dest);
      controls.autoRotate = false;
      controls.enabled = false;
      if (REDUCE) {
        camera.position.copy(dest);
        camera.lookAt(0, 0, 0);
        controls.enabled = true;
        controls.update();
        return;
      }
      camAnim = {
        sSph,
        eSph,
        t0: performance.now(),
        dur: fromUi ? 1400 : 1100
      };
    }

    function scheduleResume() {
      window.clearTimeout(idleTimer);
      if (REDUCE) return;
      idleTimer = window.setTimeout(() => {
        if (!camAnim) controls.autoRotate = true;
      }, 2800);
    }

    controls.addEventListener("start", () => {
      controls.autoRotate = false;
      window.clearTimeout(idleTimer);
    });
    controls.addEventListener("end", scheduleResume);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    renderer.domElement.addEventListener("pointerdown", (e) => {
      pointerDown = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener("pointerup", (e) => {
      if (!pointerDown) return;
      const dx = e.clientX - pointerDown.x;
      const dy = e.clientY - pointerDown.y;
      pointerDown = null;
      if (dx * dx + dy * dy > 16) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(markerMeshes, false);
      if (hits.length) {
        focusLocation(hits[0].object.userData.loc, false);
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const tmp = new THREE.Vector3();
    const sph = new THREE.Spherical();

    function updateFloatLabel() {
      if (!activeId) {
        floatEl.style.opacity = "0";
        return;
      }
      const loc = LOCATIONS.find((l) => l.id === activeId);
      const world = latLngToVec3(loc.lat, loc.lng, MARKER_R + 0.04);
      const camDir = camera.position.clone().normalize();
      const markDir = world.clone().normalize();
      const facing = camDir.dot(markDir);
      if (facing < 0.12) {
        floatEl.classList.remove("is-on");
        return;
      }
      world.project(camera);
      const x = (world.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-world.y * 0.5 + 0.5) * window.innerHeight;
      floatEl.style.transform = `translate(${x}px, ${y}px) translate(-50%, -140%)`;
      floatEl.classList.add("is-on");
    }

    function tick() {
      const t = clock.getElapsedTime();
      const clouds = globeGroup.getObjectByName("clouds");
      if (clouds) clouds.rotation.y = t * 0.012;

      glowSprites.forEach(({ sprite, ring, loc }, i) => {
        const pulse = 1 + Math.sin(t * 2.2 + i) * 0.12;
        const active = loc.id === activeId;
        const s = (active ? 0.34 : 0.2) * pulse;
        sprite.scale.set(s, s, 1);
        ring.scale.setScalar(active ? 1.35 + Math.sin(t * 3) * 0.08 : 1);
        ring.material.opacity = active ? 0.95 : 0.55;
      });

      if (camAnim) {
        const u = Math.min(1, (performance.now() - camAnim.t0) / camAnim.dur);
        const e = easeInOutCubic(u);
        sph.radius = THREE.MathUtils.lerp(camAnim.sSph.radius, camAnim.eSph.radius, e);
        sph.phi = THREE.MathUtils.lerp(camAnim.sSph.phi, camAnim.eSph.phi, e);
        sph.theta = lerpAngle(camAnim.sSph.theta, camAnim.eSph.theta, e);
        tmp.setFromSpherical(sph);
        camera.position.copy(tmp);
        camera.lookAt(0, 0, 0);
        if (u >= 1) {
          camAnim = null;
          controls.enabled = true;
          controls.update();
          scheduleResume();
        }
      } else {
        controls.update();
      }

      stars.rotation.y = t * 0.004;
      updateFloatLabel();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    tick();
    hintEl.textContent = REDUCE
      ? "Drag to spin · click a marker to focus"
      : "Drag to spin · idle resumes rotation";
  </script>
</body>
</html>
